server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 手机弱网关键：压缩文本资源（引擎 JS 3MB → ~0.7MB）
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/wasm
    application/octet-stream
    image/svg+xml
    font/ttf
    font/otf
    application/xml;

  # HTML 不缓存，保证发版后立刻拿到新入口
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files /index.html =404;
  }

  location = /ws-test.html {
    add_header Cache-Control "no-store" always;
    try_files /ws-test.html =404;
  }

  # 带 hash 的构建产物可强缓存
  location ~* \.(?:js|css|json|png|jpe?g|gif|webp|mp3|ogg|wav|wasm|bin|atlas|plist)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /websocket {
    proxy_pass http://host.docker.internal:20480/websocket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}
