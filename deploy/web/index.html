<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>湘桌 · 远程演示</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; margin: 0; background: #0f1a14; color: #eee; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    .sub { opacity: 0.75; margin-bottom: 28px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #1a2a22; padding: 12px 14px; border-radius: 8px; }
    .btn { display: inline-block; margin: 12px 12px 0 0; padding: 12px 18px; background: #2d8a5a; color: #fff; text-decoration: none; border-radius: 8px; }
    a { color: #8fd9b0; }
  </style>
</head>
<body>
  <main>
    <h1>湘桌</h1>
    <p class="sub">湖南棋牌平台 · 长沙麻将演示</p>
    <p>WebSocket</p>
    <div class="mono" id="ws">wss://xiangzhuo.xiandan.me/websocket</div>
    <p>
      <a class="btn" href="https://xiangzhuo.xiandan.me/">进入游戏</a>
      <a class="btn" href="https://github.com/liuchao0739/xiangzhuo" target="_blank" rel="noopener">GitHub 源码</a>
    </p>
    <ul>
      <li>Creator 预览加 <code>?serverAddr=wss://xiangzhuo.xiandan.me/websocket</code></li>
      <li>旧域名 <code>whmj.xiandan.me</code> 过渡期仍指向本站</li>
    </ul>
  </main>
  <script>
    document.getElementById('ws').textContent =
      (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/websocket';
  </script>
</body>
</html>
