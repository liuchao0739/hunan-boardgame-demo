services:
  xiangzhuo-web:
    image: nginx:1.27-alpine
    container_name: xiangzhuo-web
    restart: unless-stopped
    mem_limit: 32m
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - seafile-net
    labels:
      # 主域名湘桌；whmj 过渡期同站
      caddy: xiangzhuo.xiandan.me, whmj.xiandan.me
      caddy.reverse_proxy: "{{upstreams 80}}"

networks:
  seafile-net:
    external: true
